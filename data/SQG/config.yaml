# 2-level surface quasi-geostrophic PV on a doubly-periodic square grid,
# generated by data/SQG/sqg_nature_run.py. Variants differ only in grid,
# cadence and paths.
schema_version: 1
name: SQG
source_class: data.SQG.source:SQGDataSource
root: ${SQG_ROOT}
default_variant: base

defaults: &defaults
  raw_dtype: float64
  unit_name: K
  periodic: [true, true]
  variables:
    - {name: "Level 0", units: K, plot_range: [-20.0, 20.0], cmap: jet}
    - {name: "Level 1", units: K, plot_range: [-20.0, 20.0], cmap: jet}

  # raw PV -> scaled potential temperature (K): f * theta0 / g from the .nc
  # attributes (float32 f, int32 theta0), checked against `value`.
  physical:
    derive: netcdf_attrs
    value: 0.003061224412462883
    tol: 0.0

  # Nonlinear observation-function parameters (assimilation/observers/obsop.py).
  obs_fns: {scale: 7.0, arctan_gain: 15.0, log_gain: 6.0}

  # Sets trajectories_per_file = max_window // sample_length (epoch size).
  max_window: 100

variants:
  # nx=64, 3-hourly. The paper's default.
  base:
    <<: *defaults
    grid: [64, 64]
    cadence_hours: 3.0
    splits:
      train:     {dir: train/64_3h,         glob: "sqg_N64_3hrly_*.npy",            trajectory_length: 101}
      val:       {dir: val/64_3h,           glob: "sqg_N64_3hrly_*.npy",            trajectory_length: 101}
      test:      {dir: test/64_3h,          glob: "sqg_N64_3hrly_steps_110_*.npy",  trajectory_length: 111}
      test_long: {dir: test/64_3h_1000step, glob: "sqg_N64_3hrly_steps_1000_*.npy", trajectory_length: 1001}
    # Trajectory whose .nc supplies numerical-model parameters.
    climatology: {split: train, index: 0}
    normalization:
      legacy_scalar: {mean: 0.0, std: 2660.0}
      # Per-channel stats from the base 64x64 variant.
      per_channel:   {from_dir: train/64_3h}

  # nx=256.
  hires:
    <<: *defaults
    grid: [256, 256]
    cadence_hours: 3.0
    splits:
      train: {dir: train/256_3h, glob: "sqg_N256_3hrly_*.npy", trajectory_length: 1001}
      val:   {dir: val/256_3h,   glob: "sqg_N256_3hrly_*.npy", trajectory_length: 101}
      test:  {dir: test/256_3h,  glob: "sqg_N256_3hrly_*.npy", trajectory_length: 1001}
    # val/256_3h has no .nc files; train/ does.
    climatology: {split: train, index: 0}
    normalization:
      legacy_scalar: {mean: 0.0, std: 2660.0}
      # No per_channel stats at 256.

  # nx=64, 1-hourly.
  hourly:
    <<: *defaults
    grid: [64, 64]
    cadence_hours: 1.0
    splits:
      train: {dir: train/64_1h, glob: "sqg_N64_1hrly_*.npy", trajectory_length: 301}
      val:   {dir: val/64_1h,   glob: "sqg_N64_1hrly_*.npy", trajectory_length: 102}
    climatology: {split: val, index: 0}
    normalization:
      legacy_scalar: {mean: 0.0, std: 2660.0}

  # nx=64, 12-hourly. Test split only.
  twelve_hourly:
    <<: *defaults
    grid: [64, 64]
    cadence_hours: 12.0
    splits:
      test: {dir: test/64_12h, glob: "sqg_N64_12hrly_*.npy", trajectory_length: 101}
    climatology: {split: test, index: 0}
    normalization:
      legacy_scalar: {mean: 0.0, std: 2660.0}

  # nx=256, 12-hourly. Test split only.
  hires_twelve_hourly:
    <<: *defaults
    grid: [256, 256]
    cadence_hours: 12.0
    splits:
      test: {dir: test/256_12h, glob: "sqg_N256_12hrly_*.npy", trajectory_length: 1001}
    climatology: {split: test, index: 0}
    normalization:
      legacy_scalar: {mean: 0.0, std: 2660.0}
